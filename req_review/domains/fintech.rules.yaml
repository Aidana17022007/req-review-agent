# Пример чек-листа банка для ReqLens (v10): свои правила проверки требований без программирования.
# Запуск: python review.py docs/req.md reports/r.md --rules fintech   (или --rules путь/к/своему.rules.yaml)
# Формулировки — наши; это пример внутреннего стандарта, а не норма регулятора. Поле reference заполняет банк.
# Регулярки — без учёта регистра. scope: requirement — проверяется каждое подходящее требование;
# scope: document — один раз на документ (тема должна быть раскрыта где-нибудь в документе).
name: Чек-лист банка (пример для финтеха)
disclaimer: >-
  Пример внутреннего чек-листа: правила сформулированы командой ReqLens и не являются требованиями регулятора.
  Банк заменяет их своими (файл YAML, без изменения кода).
rules:
  - id: BR-01
    title: Сумма без валюты
    severity: major
    criterion: complete
    # применимо, если рядом с денежным словом стоит число от 1 000 (или от 100, записанное слитно)
    when: '(?:сумм|лимит|комисси|порог|остат|баланс|стоимост|тариф)\w*[^.;:]{0,30}?(?:\b\d{1,3}(?:[  ]\d{3})+\b|\b\d{3,}\b)'
    require:
      any:
        - 'тенге|тиын\w*|\bkzt\b|₸|\busd\b|\beur\b|доллар\w*|евро|рубл\w*|%|процент\w*'
    message: Денежное значение указано без валюты и единиц. Разработчик и тестировщик не узнают, тенге это, тиыны или доллары.
    fix: Указать валюту и единицы рядом с числом, например «500 000 тенге» или «50 000 тиын». Для мультивалютных продуктов указать, в какой валюте задан порог.
    reference: 'Внутренний стандарт требований, раздел «Денежные значения» (пример)'

  - id: BR-02
    title: Лимит без периода
    severity: major
    criterion: complete
    when: 'лимит\w*[^.;]{0,40}\d'
    require:
      any:
        - 'в (?:сутки|день|месяц|неделю|год)|за (?:сутки|день|месяц|неделю|календарн\w+|одн\w+ операци\w*|операци\w*|раз)'
        - 'на (?:одн\w+ )?(?:операци\w*|транзакци\w*|платеж\w*|платёж\w*|перевод\w*)'
        - 'суточн\w*|дневн\w*|месячн\w*|ежеднев\w*|ежемесяч\w*|разов\w*|в течение'
    message: Лимит задан числом, но без периода. Непонятно, на операцию он, на сутки или на месяц, поэтому реализация и тест разойдутся.
    fix: Указать период лимита («не более 1 000 000 тенге в сутки», «не более 200 000 тенге на одну операцию») и момент обнуления (полночь по Астане, скользящие 24 часа).

  - id: BR-03
    title: Денежная операция без защиты от повторного списания
    severity: critical
    criterion: set_complete
    scope: document
    # применимо к переводам и платежам клиента со списанием (не к начислениям банка: кэшбэк, проценты)
    when: '(?:перевод|платеж|платёж|оплат)\w*[^.;]{0,60}(?:списыва|списан|спис[ао]т)\w*|(?:списыва|списан|спис[ао]т)\w*[^.;]{0,60}(?:перевод|платеж|платёж|оплат)\w*'
    require:
      any:
        - 'идемпотент\w*|дедупликац\w*|ключ\w* (?:идемпотентност|дедупликац|запроса)'
        - 'повторн\w+ (?:запрос|списан|платеж|платёж|перевод|отправк)\w*'
        - 'тем же (?:идентификатор|ключ|номер)\w*|дубл\w+ (?:списан|платеж|платёж|перевод|операци)\w*|двойн\w+ списан\w*'
    message: В документе есть операции со списанием или переводом денег, но не сказано, что делать с повторным запросом той же операции (сбой сети, двойное нажатие). Это риск двойного списания.
    fix: Добавить требование об идемпотентности. Например, «Повторный запрос с тем же ключом операции в течение 24 часов не приводит к повторному списанию и возвращает результат первой операции».

  - id: BR-04
    title: Платёжный вызов без поведения при таймауте
    severity: major
    criterion: set_complete
    scope: document
    when: '(?:перевод|платеж|платёж|списан|оплат)\w*[^.;]{0,80}(?:процессинг|шлюз|внешн\w+ (?:систем|сервис)|интеграц\w*|\bapi\b)|(?:процессинг|шлюз|внешн\w+ (?:систем|сервис)|\bapi\b)[^.;]{0,80}(?:перевод|платеж|платёж|списан|оплат)\w*'
    require:
      all:
        - 'тайм-?аут\w*|время ожидания|не ответ\w*|нет ответа|отсутстви\w+ ответа|недоступ\w*'
        - 'повтор\w*|retry'
    message: Платёж или перевод уходит во внешнюю систему, но не описано, что делает система, если ответ не пришёл. Сколько ждать, повторять ли запрос, какой статус показать клиенту.
    fix: Задать таймаут ожидания (например, 30 секунд), число и интервал повторов, итоговый статус операции («В обработке» до ответа сверки) и текст для клиента.

  - id: BR-05
    title: Персональные данные без срока хранения
    severity: major
    criterion: set_complete
    scope: document
    when: 'персональн\w+ данн\w*|\bиин\b|паспорт\w*|удостоверени\w+ личност\w*|биометр\w*|номер\w* телефон\w*|адрес\w* проживани\w*'
    require:
      any:
        - 'хран\w*[^.;]{0,60}\d+\s*(?:лет|год|месяц|мес|дн|сут)'
        - 'срок\w* хранени\w*'
        - '(?:удаля|удал[ие]т|обезличива|уничтожа)\w*[^.;]{0,60}(?:через|после|по истечени)'
    message: Документ обрабатывает персональные данные клиента, но не задаёт срок их хранения и порядок удаления.
    fix: Указать срок хранения для каждой категории данных (например, «5 лет после закрытия счёта»), основание срока и что происходит по его истечении (удаление или обезличивание).
    reference: 'Политика банка по персональным данным (пример)'

  - id: BR-06
    title: Уведомление без канала или срока доставки
    severity: major
    criterion: complete
    when: '(?:отправля|направля|присыла|отправ[ия]т|направ[ия]т)\w*[^.;]{0,40}(?:уведомлени|оповещени|сообщени)\w*|(?:уведомля|информиру|оповеща)\w*\s+(?:клиент|пользовател|держател)\w*'
    require:
      all:
        - 'push|пуш|sms|смс|e-?mail|почт\w*|в приложени\w*|в мобильн\w+ приложени\w*|мессенджер\w*|телеграм|whatsapp'
        - '\d+\s*(?:мс|миллисекунд\w*|секунд\w*|сек\b|с\b|минут\w*|мин\b|час\w*|ч\b)|не позднее|немедленно после|в момент'
    message: Требование обязывает уведомить клиента, но не называет канал (push, SMS, e-mail) или срок доставки. Без этого нельзя проверить, что уведомление пришло вовремя.
    fix: Указать канал и предельное время доставки, например «push-уведомление не позднее 60 секунд после смены статуса», и что делать, если канал недоступен.

  - id: BR-07
    title: API без описания кодов ошибок
    severity: major
    criterion: set_complete
    scope: document
    when: '\bapi\b|\brest\b|эндпоинт\w*|endpoint|http-?(?:метод|запрос)\w*|\b(?:GET|POST|PUT|PATCH|DELETE)\b'
    require:
      all:
        - '\b401\b'
        - '\b403\b'
        - '\b404\b'
        - '\b500\b'
    message: Описан программный интерфейс, но не описаны ответы на типовые ошибки (401 — нет авторизации, 403 — нет прав, 404 — объект не найден, 500 — внутренняя ошибка). Клиенты API будут обрабатывать их по-разному.
    fix: Добавить таблицу кодов ответа. Для 401, 403, 404 и 500 указать условие, тело ответа (код и текст ошибки) и действие вызывающей стороны.

  - id: BR-08
    title: Размытое слово в нефункциональном требовании
    severity: critical
    criterion: verifiable
    when:
      section: 'нефункц|nfr|качеств|производительн|надёжн|надежн|доступност'
    forbid:
      - '\b(?:быстр\w*|удобн\w*|оперативн\w*|интуитивн\w*|мгновенн\w*|комфортн\w*|плавн\w*)\b'
    message: Нефункциональное требование задано оценочным словом без числа. Его нельзя принять или отклонить по результату замера.
    fix: Заменить оценку метрикой с порогом и условиями замера, например «время ответа не более 2 секунд для 95 % запросов при нагрузке 300 запросов в секунду».

  - id: BR-09
    title: Операция с деньгами без сценария отказа
    severity: major
    criterion: set_complete
    scope: document
    when: '(?:списыва|списан|спис[ао]т|перевод[ия]т|оплачива)\w*'
    require:
      any:
        - 'отклон\w*|отказ\w*|ошибк\w*|недостаточн\w+ (?:средств|баланс)\w*|не (?:прошл|выполн|исполн)\w*'
    message: Описаны операции с деньгами, но нет ни одного сценария отказа (недостаточно средств, отказ процессинга, превышен лимит). Тестировщику не с чем сверить негативные проверки.
    fix: Добавить требования о реакции системы на отказ. Перечислить причины отказа, статус операции, текст клиенту и возврат средств, если списание уже прошло.

  - id: BR-10
    title: У требований нет приоритета
    severity: minor
    criterion: set_ranked
    scope: document
    require:
      any:
        - 'приоритет\w*|\bmust\b|\bshould\b|\bcould\b|moscow|обязательн\w*\s*/\s*желательн\w*'
    message: Ни у одного требования нет приоритета. При нехватке сроков команда не знает, что можно отложить.
    fix: Добавить колонку или пометку приоритета (Must / Should / Could) для каждого требования.
    enabled: false
    reason: >-
      Выключено в примере: стандартный критерий «Ранжирование по важности» (IEEE 830 §4.3.5) агент уже проверяет
      сам. Включите (enabled: true), если в вашем шаблоне приоритет обязателен и нужен отдельный пункт чек-листа.
