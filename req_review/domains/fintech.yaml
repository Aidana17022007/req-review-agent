# Финтех-чек-лист: области, которые обычно должны быть покрыты требованиями банковского продукта.
# Это подсказка для проверки полноты набора (ISO/IEC/IEEE 29148 §5.2.6 a), а не юридическое заключение.
# Формат позволяет добавить другой домен без изменения кода: положите рядом <домен>.yaml.
name: Финтех / банковские системы
disclaimer: >-
  Чек-лист — ориентир для проверки полноты, а не юридическое или регуляторное заключение.
  Применимость каждой области определяет владелец продукта.
areas:
  - id: auth
    title: Аутентификация и двухфакторная проверка
    question: Как клиент подтверждает личность при входе и при операциях (пароль, OTP, биометрия)? Какие факторы обязательны?
    keywords: [аутентиф, авториз, вход, логин, парол, OTP, одноразов, биометр, 2FA, двухфактор]
  - id: session
    title: Управление сессиями
    question: Какой таймаут неактивной сессии, сколько одновременных сессий допустимо, что происходит при входе с нового устройства?
    keywords: [сесси, таймаут, тайм-аут, нового устройства, выход из]
  - id: crypto
    title: Шифрование данных при передаче и хранении
    question: Какие данные шифруются при хранении и передаче и по какому стандарту/алгоритму?
    keywords: [шифр, зашифр, TLS, криптограф]
  - id: access
    title: Роли и права доступа
    question: Какие роли есть в системе (клиент, оператор, администратор) и какие права у каждой?
    keywords: [рол, прав доступ, администратор, оператор, полномоч]
  - id: audit
    title: Аудит-лог действий
    question: Какие действия журналируются, какие поля фиксируются и сколько хранится журнал?
    keywords: [аудит, журнал, лог, логир, журналир]
  - id: limits
    title: Лимиты и комиссии
    question: Какие лимиты (на операцию, сутки, месяц) и комиссии действуют, от чего зависят и кто их меняет?
    keywords: [лимит, комисси, тариф, максимальн сумм, сумма]
  - id: status
    title: Статусы операций и идемпотентность
    question: Какие статусы проходит операция и как исключается повторное списание при повторной отправке запроса?
    keywords: [статус, идемпотент, повторн, дубл]
  - id: errors
    title: Обработка ошибок, таймаутов и повторов
    question: Что видит клиент и что делает система при сбое, таймауте внешней системы, недостатке средств?
    keywords: [ошибк, сбо, таймаут, недоступ, исключени, отказ]
  - id: fraud
    title: Антифрод и AML-мониторинг
    question: Какие операции проверяются антифрод/AML-системой, какие действия при подозрении на мошенничество?
    keywords: [мошенн, фрод, антифрод, AML, отмыв, подозрит]
  - id: pdata
    title: Защита персональных данных
    question: Какие персональные данные обрабатываются, где хранятся, как получается согласие клиента (Закон РК «О персональных данных и их защите»)?
    keywords: [персональн, ПДн, согласи, конфиденц]
  - id: pci
    title: Платёжные стандарты (PCI DSS — при работе с карточными данными)
    question: Обрабатываются ли карточные данные? Если да — как обеспечивается соответствие PCI DSS?
    keywords: [PCI, карт, PAN, CVV]
  - id: sla
    title: Доступность и производительность (SLA)
    question: Какой целевой уровень доступности (например, 99,9 % в месяц) и время отклика для ключевых операций?
    keywords: [доступн, SLA, время ответа, время отклика, 24/7, производительн]
  - id: dr
    title: Резервирование и восстановление
    question: Какие RTO/RPO, как часто делается резервное копирование, как восстанавливается сервис после аварии?
    keywords: [резерв, бэкап, backup, восстановл, RTO, RPO]
  - id: monitoring
    title: Мониторинг и оповещения
    question: Какие показатели мониторятся и кто получает оповещения об инцидентах?
    keywords: [мониторинг, оповещ, алерт, инцидент]
  - id: notify
    title: Уведомления клиента
    question: О каких событиях и каким каналом уведомляется клиент (push, SMS, e-mail)?
    keywords: [уведомл, push, SMS, оповещ]
  - id: l10n
    title: Локализация (казахский / русский)
    question: На каких языках доступен интерфейс и сообщения (казахский, русский, английский)?
    keywords: [язык, казах, локализ, русск]
  - id: a11y
    title: Доступность интерфейса для людей с ограничениями
    question: Должен ли интерфейс соответствовать требованиям доступности (например, WCAG 2.1 AA)?
    keywords: [WCAG, доступность интерфейса, слабовидящ, скринридер]
