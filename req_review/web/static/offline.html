<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReqLens — нет интернета</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#02030C">
<style>
  /* дизайн-система v3 «Ecliptic Dawn»: ночная панель на градиенте рассвета */
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; padding: 16px; box-sizing: border-box; display: grid;
         font: 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: #F4F5FF;
         background: linear-gradient(180deg, #333E9F 0%, #3B4CB6 35%, #7E82CE 70%, #E3CDDB 100%); }
  main { position: relative; overflow: hidden; display: grid; place-items: center; text-align: center; border-radius: 36px;
         padding: 48px 24px; background: #02030C; }
  main::after { content: ""; position: absolute; inset: auto 0 0 0; height: 55%; pointer-events: none;
                background: linear-gradient(180deg, transparent, rgba(68,89,200,.55) 60%, rgba(145,145,211,.65)); }
  .in { position: relative; z-index: 1; max-width: 440px; }
  img { width: 64px; height: 64px; }
  h1 { font-size: 40px; font-weight: 500; letter-spacing: -.04em; line-height: 1.05; margin: 20px 0 10px; }
  p { margin: 0 0 24px; color: #A3A8C9; }
  a { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 22px; border-radius: 999px; background: #fff;
      color: #02030C; text-decoration: none; font-weight: 500; }
  a:focus-visible { outline: 2px solid #8E9BFF; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="in">
    <img src="/static/icon.svg" alt="">
    <h1>Нет интернета</h1>
    <p>Новая проверка обращается к модели и требует сети. Уже открытые проверки и отчёты доступны из истории.</p>
    <a href="/">Повторить ›</a>
  </div>
</main>
</body>
</html>
