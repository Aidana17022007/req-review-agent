# Render Blueprint: ReqLens Studio + API v1 (бэкенд). Render → New → Blueprint → этот репозиторий.
# После этого каждый push в main передеплоит сервис сам (autoDeploy). Ключ модели задаётся в панели Render
# (Environment → OPENAI_API_KEY для DeepSeek) и в репозиторий не попадает. Без ключа Studio работает в режиме «только правила».
services:
  - type: web
    name: reqlens-studio
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    # отчёт для сдачи распаковывается рядом с report.json — для режима «Демо» (проигрывание настоящего прогона без квоты)
    buildCommand: pip install -r requirements.txt && gunzip -kf reports/requirements-report.html.gz
    startCommand: python -m req_review.web --demo reports/requirements-report.json
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: STUDIO_HOST
        value: 0.0.0.0
      # модель — DeepSeek через OpenAI-совместимый API (без суточной квоты Gemini)
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.deepseek.com/v1
      - key: OPENAI_MODEL
        value: deepseek-chat
      - key: OPENAI_API_KEY
        sync: false            # вводится в панели Render, в git не хранится
      # резерв: DeepSeek отказал (нет баланса, ключ, квота, не отвечает) — тот же прогон продолжается на Gemini
      - key: LLM_BACKUP_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false            # ключ Google AI Studio, вводится в панели Render; без него резерва нет, всё как раньше
      - key: LLM_TIMEOUT
        value: "60"
      - key: REQLENS_PROFILE
        value: fast            # быстрый профиль для посетителей; deep — для отчёта, который сдаётся
      - key: MAX_JOBS
        value: "1"             # бесплатный тариф: один прогон за раз, остальные ждут в очереди
      - key: REQLENS_DATA
        value: /tmp/reqlens    # история прогонов (на бесплатном тарифе диск не сохраняется между деплоями)
      - key: DEMO_UPLOADS_PER_IP
        value: "5"             # v9: проверок с моделью с одного адреса в сутки (UTC); 0 — без лимита
      - key: DEMO_UPLOADS_TOTAL
        value: "30"            # v9: проверок с моделью всего в сутки; готовый пример и «только правила» не считаются
      - key: DEMO_UPLOADS_PER_IP_HOUR
        value: "3"             # v13: проверок с моделью с одного адреса за час
      - key: DEMO_LIMIT_FALLBACK
        value: rules           # v13: лимит исчерпан — проверка только правилами вместо отказа (пометка в Studio)
      - key: DEMO_PURGE_MINUTES
        value: "60"            # v13: загруженный документ удаляется с сервера через час после проверки
      - key: STUDIO_MAX_MB
        value: "5"             # v13: файл до 5 МБ
