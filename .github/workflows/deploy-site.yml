# Сайт ReqLens на Cloudflare Pages: при каждом push в main сайт собирается заново (scripts/build_site.py)
# и выкладывается. Нужны секреты репозитория CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID (Settings → Secrets
# and variables → Actions) и переменная STUDIO_URL (адрес Studio на Render). Без секретов шаг деплоя пропускается.
name: Deploy site (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        env:
          STUDIO_URL: ${{ vars.STUDIO_URL }}
        run: |
          pip install markdown
          python scripts/build_site.py --out public
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public/
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=reqlens --branch=main --commit-dirty=true
