# Цены моделей для оценки стоимости прогона (паспорт отчёта, поле passport.cost).
# Цены — в долларах США за 1 млн токенов. Заполняйте ТОЛЬКО по официальной странице цен провайдера и пишите дату
# сверки: цены меняются. Пустое значение (null) — цена не указана, и отчёт так и пишет, ничего не придумывая.
# Ключ — имя модели (как в паспорте: «провайдер / модель») или его часть; берётся самое длинное совпадение.
usd_kzt: null            # курс для пересчёта в тенге (например, по курсу НБ РК на дату); null — только в долларах
models:
  "gemini / gemini-":     # бесплатный тариф Google AI Studio
    free_tier: true
    note: "бесплатный тариф Google AI Studio: оплаты нет, есть лимиты запросов в минуту и в сутки"
  "mock /":
    free_tier: true
    note: "mock — модель не вызывается"
  "без модели":
    free_tier: true
    note: "только правила — модель не вызывается"
  "openai / deepseek-chat":
    input_per_1m: null    # заполнить по https://api-docs.deepseek.com (страница цен), указать дату сверки
    output_per_1m: null
    checked: null
  "openrouter /":
    input_per_1m: null    # у каждой модели OpenRouter своя цена — заполнить для используемой модели
    output_per_1m: null
    checked: null
