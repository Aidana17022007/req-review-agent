services:
  # Прогон одной командой:  docker compose run --rm review docs/requirements.md reports/report.md
  review:
    build: .
    image: reqlens
    env_file: .env
    volumes:
      - ./:/work
    working_dir: /work

  # Веб-интерфейс:  docker compose up studio  →  http://localhost:8000
  studio:
    build: .
    image: reqlens
    entrypoint: ["python", "-m", "req_review.web"]
    working_dir: /app
    env_file: .env
    environment:
      STUDIO_HOST: 0.0.0.0
      STUDIO_PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
