<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="ReqLens — ИИ-ревью требований по ISO/IEC/IEEE 29148">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14532D"/><stop offset="1" stop-color="#2E8B57"/></linearGradient>
    <pattern id="rings" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1.2" fill="#ffffff" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="32" fill="#F3F5F3"/>
  <rect x="24" y="24" width="760" height="312" rx="24" fill="#FFFFFF" stroke="#E6EAE7"/>
  <g transform="translate(64 68)">
    <circle cx="22" cy="22" r="20" fill="#E7F4EC" stroke="#1F6B45" stroke-width="5"/>
    <circle cx="22" cy="22" r="7" fill="#1F6B45"/>
    <text x="58" y="32" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#111813" letter-spacing="-1">ReqLens</text>
  </g>
  <text x="64" y="176" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#111813" letter-spacing="-1">Дефекты требований —</text>
  <text x="64" y="220" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#1F6B45" letter-spacing="-1">до первой строчки кода</text>
  <text x="64" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#5E6A62">ИИ-агент статической проверки по ISO/IEC/IEEE 29148 и IEEE 830</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="64" y="282" width="122" height="30" rx="15" fill="#E7F4EC"/><text x="125" y="302" text-anchor="middle" fill="#1F6B45">Тест-проба</text>
    <rect x="196" y="282" width="152" height="30" rx="15" fill="#E7F4EC"/><text x="272" y="302" text-anchor="middle" fill="#1F6B45">Автоисправление</text>
    <rect x="358" y="282" width="136" height="30" rx="15" fill="#E7F4EC"/><text x="426" y="302" text-anchor="middle" fill="#1F6B45">Финтех-домен</text>
    <rect x="504" y="282" width="144" height="30" rx="15" fill="#E7F4EC"/><text x="576" y="302" text-anchor="middle" fill="#1F6B45">Офлайн-режим</text>
  </g>
  <rect x="808" y="24" width="368" height="312" rx="24" fill="url(#hero)"/>
  <rect x="808" y="24" width="368" height="312" rx="24" fill="url(#rings)"/>
  <text x="840" y="80" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">Проверка по стандарту</text>
  <text x="840" y="180" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="88" font-weight="700" fill="#FFFFFF" letter-spacing="-3">29148</text>
  <text x="840" y="220" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#FFFFFF" opacity=".85">ISO/IEC/IEEE · IEEE Std 830-1998</text>
  <rect x="840" y="262" width="160" height="40" rx="20" fill="#FFFFFF"/>
  <text x="920" y="288" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#14532D">Запустить проверку</text>
</svg>
